name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # package-lock.json is committed, so `npm ci` installs the exact tree the
      # package was built and tested against.
      - name: Install dependencies
        run: npm ci

      - name: Install extraction tools
        run: pip install --disable-pip-version-check yt-dlp

      - name: Extractor tests
        run: python3 -m unittest discover -s tests -v

      - name: Render smoke test
        run: npm run test:render

      - name: Protocol integration test
        run: npm run test:client

      - name: Build frontend
        run: npm run build

      - name: Build KIKX package
        id: package
        run: echo "path=$(npm run --silent package)" >> "$GITHUB_OUTPUT"

      - name: Verify the package matches the manifest
        run: |
          set -eu
          unzip -o -q "${{ steps.package.outputs.path }}" -d verify
          test -f verify/app/app.json
          test -f verify/app/public/icon.png
          test -f verify/app/www/index.html
          test -f verify/app/micro/extractor/main.py
          test "$(ls verify | wc -l)" -eq 1

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
          fail_on_unmatched_files: true
